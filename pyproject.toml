[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-player-for-sonos"
version = "0.1.0"
description = "A terminal mixer, player and music visualizer for Sonos speakers on Linux. Not affiliated with Sonos, Inc."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "soco>=0.30,<1",
    "textual>=3,<10",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
openplayer = "openplayer.cli:main"

[tool.setuptools]
packages = ["openplayer"]
