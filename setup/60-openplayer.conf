# Open Player for Sonos: a virtual cable to the Sonos speakers.
# Apps play into the "Sonos" output; swyh-rs records the other end
# ("openplayer_capture") and serves it to the speakers over Wi-Fi.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Sonos"
      audio.rate = 48000
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "sonos"
        media.class = "Audio/Sink"
        priority.session = 0
      }
      playback.props = {
        node.name = "openplayer_capture"
        node.description = "Open Player capture"
        media.class = "Audio/Source"
        node.passive = true
        priority.session = 0
      }
    }
  }
]
